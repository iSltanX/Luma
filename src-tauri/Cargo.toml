[package]
name = "luma"
version = "1.1.0"
description = "محرر كتابة هادئ للكاتب العربي على macOS"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# لوحة اختيار الملف الأصلية — §١ «ما يجب أن يأتي من المنصة».
tauri-plugin-dialog = "2"

# تعداد خطوط النظام وتسجيل المستوردة وقراءة جدول محارفها — §٨.
# بلا شبكة: كل ما تحتاجه CoreText محلي.
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
core-foundation = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
